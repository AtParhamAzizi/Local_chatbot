name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  CUDA_VISIBLE_DEVICES: ''
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  STT_LOCAL_FILES_ONLY: '1'

jobs:
  source:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check syntax, repeated imports, tracked bytecode and changed whitespace
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
        run: python -B backend/tests/check_source.py --base "$CHECK_BASE"

  offline:
    name: Offline (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-24.04
            python: '3.13'
          - os: windows-2025
            python: '3.13'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/tests/requirements.txt
      - run: python -m pip install -r backend/tests/requirements.txt
      - run: python -B backend/tests/run_tests.py --repeat 2 -v

  mysql:
    name: Flask / disposable MySQL
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/tests/requirements.txt
            backend/tests/mysql/requirements.txt
      - run: python -m pip install -r backend/tests/mysql/requirements.txt
      - name: Verify Docker prerequisites
        run: |
          docker info
          docker compose version
      - run: python -B backend/tests/run_mysql_tests.py --repeat 2

  ocr:
    name: Local Persian OCR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-fas fonts-dejavu-core
      - run: python -m pip install -r backend/tests/requirements.txt 'PyMuPDF>=1.24,<2'
      - name: Compare PDF layout extraction with the flattened baseline
        run: python -B backend/tests/pdf_layout_eval.py
      - run: python -B backend/tests/ocr_smoke.py

  browser:
    name: Browser smoke (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/tests/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/tests/browser/package-lock.json
      - run: python -m pip install -r backend/tests/requirements.txt
      - run: npm ci --prefix backend/tests/browser --ignore-scripts --no-audit --no-fund
      - run: node backend/tests/browser/node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: python -B backend/tests/browser_smoke.py --channel chromium --repeat 2
      - name: Retain browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-smoke-${{ github.run_attempt }}
          path: backend/tests/browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  merge-checks:
    name: Merge checks
    if: ${{ always() }}
    needs: [source, offline, mysql, ocr, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CPU check to succeed
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          OFFLINE_RESULT: ${{ needs.offline.result }}
          MYSQL_RESULT: ${{ needs.mysql.result }}
          OCR_RESULT: ${{ needs.ocr.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          for result in "$SOURCE_RESULT" "$OFFLINE_RESULT" "$MYSQL_RESULT" "$OCR_RESULT" "$BROWSER_RESULT"; do
            if [ "$result" != success ]; then
              echo "A required CPU check failed, was cancelled, or was skipped."
              exit 1
            fi
          done
