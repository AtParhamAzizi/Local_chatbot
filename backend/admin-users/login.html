<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrator Login</title>
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand-mark" aria-hidden="true">✦</div>
      <p class="eyebrow">LOCAL CHATBOT</p>
      <h1 id="login-title">Administrator Login</h1>
      <p class="intro">Sign in to manage models, knowledge, chats, and system controls.</p>
      <form id="loginForm" method="post" action="/login" novalidate>
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <div class="password-field">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button class="password-toggle" id="passwordToggle" type="button" aria-label="Show password">Show</button>
        </div>
        <p class="form-error" id="loginError" role="alert">{{ error or '' }}</p>
        <button class="submit-button" id="submitButton" type="submit"><span>Sign in</span><span class="submit-arrow" aria-hidden="true">→</span></button>
      </form>
      <p class="security-note"><span aria-hidden="true">●</span> Protected administrator workspace</p>
    </section>
  </main>
  <script src="/theme.js"></script>
  <script src="/login.js"></script>
</body>
</html>
