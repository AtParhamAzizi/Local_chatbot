<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin user control</title>
  <link rel="stylesheet" href="admin-user-control.css">
</head>
<body>
  <main class="wrap">
    <header class="page-header">
      <div>
        <p class="eyebrow">ACCESS MANAGEMENT</p>
        <h1>Admin user control</h1>
        <p class="subtitle">Create administrator accounts and control which admin menus they can access.</p>
      </div>
      <div class="header-orb" aria-hidden="true">✦</div>
    </header>

    <section class="glass-card">
      <div class="section-heading"><div><p class="eyebrow">NEW ACCOUNT</p><h2>Create user</h2></div><span class="status-dot">● Secure</span></div>
      <p class="message" id="message" role="status"></p>
      <form id="userForm" class="user-form">
        <div class="field"><label for="username">Username</label><input id="username" name="username" placeholder="e.g. content-manager" required minlength="3"></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="At least 8 characters" required minlength="8"></div>
        <fieldset class="permissions"><legend>Menu access</legend>
          <label><input type="checkbox" name="permissions" value="json_upload"> JSON upload</label>
          <label><input type="checkbox" name="permissions" value="pdf_upload"> PDF upload</label>
          <label><input type="checkbox" name="permissions" value="models"> Models</label>
          <label><input type="checkbox" name="permissions" value="chats"> Chats</label>
          <label><input type="checkbox" name="permissions" value="system_reports"> Reports</label>
          <label><input type="checkbox" name="permissions" value="controller"> Controller</label>
        </fieldset>
        <button class="btn-primary" type="submit">Create user <span aria-hidden="true">→</span></button>
      </form>
    </section>

    <section class="glass-card">
      <div class="section-heading"><div><p class="eyebrow">DIRECTORY</p><h2>Admin users</h2></div><span class="directory-count" id="directoryCount">— users</span></div>
      <div class="table-shell"><table><thead><tr><th>Username</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody id="users"></tbody></table></div>
    </section>
  </main>
  <script src="../theme.js"></script>
  <script src="admin-user-control.js"></script>
</body>
</html>
