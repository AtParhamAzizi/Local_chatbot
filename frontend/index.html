<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت بات سامانه</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>چت سامانه پیام</h1>
            <div class="connection-status" id="connectionStatus"></div>
        </div>

        <div class="chat-messages" id="chatMessages" dir="ltr">
            <div class="message bot-message">
                سلام من چت بات هوشمند سامانه پیام ایران هستم، چطور میتونم کمکتون کنم؟
            </div>

            <div id="quick-questions" class="quick-questions" dir="rtl">
                <button class="quick-question-btn" onclick="sendQuickQuestion('سامانه پیام ایران چیست؟')">
                    سامانه پیام ایران چیست؟</button>
                <button class="quick-question-btn" onclick="sendQuickQuestion('در مرحله ثبت نام چه اطلاعاتی مورد نیاز است؟')">
                    در مرحله ثبت نام چه اطلاعاتی مورد نیاز است؟</button>
                <button class="quick-question-btn" onclick="sendQuickQuestion('پنجره ملی خدمات دولت هوشمند چیست؟')">
                    پنجره ملی خدمات دولت هوشمند چیست؟</button>
                <button class="quick-question-btn" onclick="sendQuickQuestion('آیا استفاده از خدمات پنجره ملی دولت هوشمند مشمول هزینه است؟')">
                    آیا استفاده از خدمات پنجره ملی دولت هوشمند مشمول هزینه است؟</button>
            </div>
        </div>
<!--        recommendation part            -->
        <div class="recommended-questions" id="recommendedQuestions">
        </div>

        <details class="privacy-notice" id="privacyNotice">
            <!-- <summary>حریم خصوصی و نگهداری داده‌ها</summary> -->
            <!-- <div class="privacy-details">
                <p>متن پیام و پاسخ برای بررسی کیفیت پاسخ‌ها توسط مدیران مجاز نگهداری می‌شود؛ برای آموزش خودکار مدل استفاده نمی‌شود. اطلاعات حساس وارد نکنید.</p>
                <p>{% if privacy.chat_days %}مهلت حذف گفتگوها: {{ privacy.chat_days }} روز پس از ثبت پیام.{% else %}ذخیره گفتگو غیرفعال است.{% endif %}
                {% if privacy.feedback_days and privacy.chat_days %}بازخورد برای ارزیابی کیفیت پاسخ، حداکثر {{ [privacy.feedback_days, privacy.chat_days] | min }} روز پس از ثبت پیام نگهداری می‌شود و همراه پیام حذف می‌شود.{% else %}ذخیره بازخورد غیرفعال است.{% endif %}</p>
                <p>{% if privacy.ip_days and privacy.chat_days %}نشانی IP برای عیب‌یابی، حداکثر {{ [privacy.ip_days, privacy.chat_days] | min }} روز همراه گفتگو ذخیره می‌شود.{% else %}نشانی IP در تاریخچه گفتگو ذخیره نمی‌شود.{% endif %} IP برای محدودسازی درخواست‌ها موقتاً در حافظه استفاده می‌شود.</p>
                <p>{% if privacy.log_days %}گزارش‌های عملیاتی برای امنیت و رفع خطا، {{ privacy.log_days }} روز نگهداری می‌شوند؛ متن گفتگو و مقدار بازخورد در گزارش‌های جدید ثبت نمی‌شود.{% else %}ذخیره گزارش‌های برنامه در پایگاه داده غیرفعال است.{% endif %}</p>
                <p>{% if privacy.delete_enabled %}پاک‌سازی دوره‌ای هر {{ privacy.interval_seconds }} ثانیه اجرا می‌شود؛ حذف ممکن است تا اجرای بعدی طول بکشد.{% else %}حذف خودکار فعلاً توسط گرداننده متوقف شده است؛ داده‌های قبلی تا ازسرگیری پاک‌سازی باقی می‌مانند.{% endif %} حذف زودتر گفتگو را از گرداننده سامانه بخواهید. نسخه‌های پشتیبان و گزارش‌های زیرساخت، سیاست نگهداری جداگانه دارند.</p>
                <p>یک کوکی ناشناس برای اثبات مالکیت پیام و بازخورد تا ۲۴ ساعت معتبر است؛ حذف کوکی، گفتگوهای ذخیره‌شده را حذف نمی‌کند.</p>
            </div> -->
        </details>
        <div class="voice-panel">
            <!-- <span id="voiceStatus" class="voice-status" role="status" aria-live="polite" data-waiting="true">در حال بررسی گفت‌وگوی صوتی...</span>
            <label class="voice-replies"><input id="voiceReplies" type="checkbox" checked aria-describedby="playbackPrivacy"> خواندن پاسخ پیام صوتی</label> -->
            <button id="voiceStopButton" class="voice-stop" type="button" hidden>توقف خواندن</button>
            <audio id="voicePlayer" controls preload="none" aria-label="پخش پاسخ صوتی" hidden></audio>
            <!-- <p id="playbackPrivacy">گفتار روی سرور همین سامانه به متن تبدیل می‌شود؛ پس از مکث، متن خودکار ارسال می‌شود. پاسخ با مدل‌های صوتی همین سرور خوانده می‌شود؛ صدای شما و فایل پاسخ ذخیره نمی‌شوند.</p> -->
        </div>
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="اینجا بنویسید..." autocomplete="off">
            <button id="voiceButton" class="voice-button" type="button" aria-label="شروع ضبط صدا" aria-pressed="false" aria-describedby="voiceStatus" title="شروع ضبط صدا" disabled>
                <svg class="microphone-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect x="9" y="2" width="6" height="13" rx="3" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M9 22h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <svg class="stop-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="4"/></svg>
            </button>
            <button id="sendButton">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="sndbtnpath">
                    <path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" fill="white"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="script.js"></script>
</body>
</html>
